name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lightweight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The bridge uses Forge's console progress dependency; no inference stack.
      - name: Install lightweight test dependency
        run: python -m pip install --disable-pip-version-check "tqdm==4.67.1"
      - run: python -B tools/lightweight_checks.py
